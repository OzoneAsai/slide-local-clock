<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studio Clock — Sound & Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass: rgba(10, 12, 16, 0.7);
      --glass-strong: rgba(10, 12, 16, 0.9);
      --accent: #c2d5ff;
      --accent-strong: #8fb0ff;
      --text: #f5f7ff;
      --muted: #9fb0c8;
      --card-radius: 18px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Space Grotesk', sans-serif; color: var(--text); background: #05070c; }
    #bg { position: fixed; inset: 0; background-size: cover; background-position: center; transition: background-image 1s ease-in-out, filter 0.6s ease; }
    .scrim { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5,7,12,0.45) 0%, rgba(5,7,12,0.75) 100%); pointer-events: none; }

    .hud { position: relative; z-index: 2; width: 100%; height: 100%; padding: 32px; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; }

    .top-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }

    .clock-card { background: var(--glass); border-radius: var(--card-radius); padding: 18px 22px; backdrop-filter: saturate(120%); box-shadow: var(--shadow); min-width: 240px; }
    .clock-time { font-size: 56px; font-weight: 700; letter-spacing: 2px; margin: 0; }
    .clock-date { margin: 6px 0 0; font-size: 18px; color: var(--muted); }

    .pomodoro-card { background: var(--glass); border-radius: var(--card-radius); padding: 16px 20px; display: flex; align-items: center; gap: 18px; min-width: 280px; box-shadow: var(--shadow); }
    .pomodoro-visual { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
    .pomodoro-visual::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 55%); }
    .pomodoro-ring { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--accent-strong) calc(var(--progress) * 1deg), rgba(255,255,255,0.08) 0deg); display: grid; place-items: center; padding: 12px; transition: background 0.3s ease; }
    .pomodoro-core { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.05); display: grid; place-items: center; font-weight: 700; letter-spacing: 1px; }
    .pomodoro-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .pomodoro-label { font-size: 14px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .pomodoro-title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.8px; }
    .pomodoro-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,0.05); color: var(--text); cursor: pointer; transition: all 0.2s ease; font-weight: 600; letter-spacing: 0.3px; }
    .pill:hover { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.08); }
    .pill.secondary { color: var(--muted); }

    .bottom-row { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .pill.ghost { background: rgba(255,255,255,0.08); border-color: transparent; color: var(--muted); }

    .fab { position: fixed; right: 22px; bottom: 22px; width: 54px; height: 54px; border-radius: 50%; background: var(--glass-strong); border: 1px solid rgba(255,255,255,0.12); display: grid; place-items: center; color: var(--text); cursor: pointer; box-shadow: var(--shadow); z-index: 4; transition: transform 0.2s ease, background 0.2s ease; }
    .fab:hover { transform: translateY(-2px); background: rgba(20,22,30,0.95); }

    .menu-panel { position: fixed; right: 22px; bottom: 86px; width: 220px; background: var(--glass-strong); border-radius: var(--card-radius); padding: 12px; box-shadow: var(--shadow); z-index: 4; display: none; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.08); }
    .menu-panel.open { display: flex; }
    .menu-item { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.05); cursor: pointer; border: 1px solid transparent; font-weight: 600; letter-spacing: 0.3px; }
    .menu-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }

    .window { position: fixed; bottom: 120px; right: 22px; width: 380px; max-height: 520px; background: var(--glass-strong); border-radius: var(--card-radius); padding: 16px; box-shadow: var(--shadow); z-index: 4; border: 1px solid rgba(255,255,255,0.14); display: none; flex-direction: column; gap: 12px; }
    .window header { display: flex; align-items: center; justify-content: space-between; font-weight: 700; letter-spacing: 0.4px; }
    .close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .window.open { display: flex; }

    .diary-text { width: 100%; min-height: 220px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); padding: 12px; resize: vertical; }
    .window small { color: var(--muted); }

    .settings-sections { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-right: 4px; }
    .setting-card { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.06); }
    .setting-card h3 { margin: 0 0 8px; font-size: 16px; letter-spacing: 0.4px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .field label { font-size: 13px; color: var(--muted); }
    .field input[type="text"],
    .field input[type="number"],
    .field input[type="url"],
    .field textarea { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px; color: var(--text); font-size: 14px; }
    .inline-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .mini-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.08); color: var(--text); cursor: pointer; font-weight: 600; letter-spacing: 0.2px; }
    .mini-btn:hover { background: rgba(255,255,255,0.12); }

    .soundcloud-frame { width: 100%; border: none; border-radius: 12px; height: 120px; background: rgba(255,255,255,0.04); display: none; }
    .soundcloud-frame.active { display: block; }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6fffba; box-shadow: 0 0 8px rgba(111,255,186,0.7); }

    @media (max-width: 900px) {
      .hud { padding: 18px; grid-template-rows: auto 1fr auto; }
      .top-row { flex-direction: column; align-items: stretch; }
      .pomodoro-card, .clock-card { width: 100%; }
      .window { right: 12px; left: 12px; width: auto; }
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div class="scrim"></div>
  <div class="hud">
    <div class="top-row">
      <div class="clock-card">
        <p class="clock-date" id="weekday">-- --</p>
        <h1 class="clock-time" id="time">--:--</h1>
        <p class="clock-date" id="date">--/--/--</p>
      </div>
      <div class="pomodoro-card">
        <div class="pomodoro-visual">
          <div class="pomodoro-ring" id="pomodoroRing" style="--progress:0">
            <div class="pomodoro-core" id="pomodoroCore">25:00</div>
          </div>
        </div>
        <div class="pomodoro-info">
          <span class="pomodoro-label">Pomodoro Timer</span>
          <p class="pomodoro-title" id="pomodoroTitle">Focus</p>
          <div class="pomodoro-actions">
            <button class="pill" id="pomodoroToggle">Start</button>
            <button class="pill secondary" id="pomodoroReset">Reset</button>
            <button class="pill secondary" id="pomodoroSkip">Skip</button>
          </div>
        </div>
      </div>
    </div>

    <div></div>

    <div class="bottom-row">
      <button class="pill ghost" id="bgPrev">◀ Prev</button>
      <button class="pill ghost" id="bgNext">Next ▶</button>
      <button class="pill" id="soundcloudStart">Start SoundCloud</button>
      <span class="status-dot" title="Live clock"></span>
    </div>
  </div>

  <div class="fab" id="menuFab" aria-label="open menu">≡</div>
  <div class="menu-panel" id="menuPanel">
    <div class="menu-item" id="openDiary">Diary</div>
    <div class="menu-item" id="openSettings">Settings</div>
  </div>

  <div class="window" id="diaryWindow">
    <header>
      <span>Diary</span>
      <button class="close-btn" data-close="diaryWindow">×</button>
    </header>
    <textarea class="diary-text" id="diaryText" placeholder="Capture a thought..." aria-label="Diary"></textarea>
    <div class="inline-controls">
      <button class="mini-btn" id="saveDiary">Save note</button>
      <small id="diarySaved">Not saved</small>
    </div>
  </div>

  <div class="window" id="settingsWindow">
    <header>
      <span>Settings</span>
      <button class="close-btn" data-close="settingsWindow">×</button>
    </header>
    <div class="settings-sections">
      <div class="setting-card">
        <h3>Wallpaper</h3>
        <div class="field">
          <label>Slideshow interval (seconds)</label>
          <input type="number" id="bgInterval" min="5" max="600" step="5" value="30">
        </div>
        <div class="inline-controls">
          <button class="mini-btn" id="openFolderBtn">Open folder</button>
          <button class="mini-btn" id="overlayBtn">Overlay mode</button>
          <button class="mini-btn" id="wallpaperBtn">Wallpaper mode</button>
          <button class="mini-btn" id="stopDesktopBtn" style="display:none">Stop desktop</button>
        </div>
      </div>
      <div class="setting-card">
        <h3>SoundCloud</h3>
        <div class="field">
          <label>Track or playlist URL</label>
          <input type="url" id="soundcloudUrl" placeholder="https://soundcloud.com/...">
        </div>
        <div class="inline-controls">
          <button class="mini-btn" id="applySoundcloud">Apply</button>
        </div>
        <iframe id="soundcloudPlayer" class="soundcloud-frame" allow="autoplay"></iframe>
      </div>
      <div class="setting-card">
        <h3>Pomodoro</h3>
        <div class="field">
          <label>Focus minutes</label>
          <input type="number" id="focusMinutes" min="5" max="120" step="1" value="25">
        </div>
        <div class="field">
          <label>Break minutes</label>
          <input type="number" id="breakMinutes" min="1" max="60" step="1" value="5">
        </div>
      </div>
    </div>
  </div>

  <script src="lang-constants.js"></script>
  <script>
    const state = {
      backgrounds: [],
      currentBg: 0,
      slideshowTimer: null,
      settings: {
        slideshowInterval: 30,
        soundcloudUrl: '',
        pomodoro: { focus: 25, break: 5 },
        diary: ''
      },
      pomodoro: {
        mode: 'focus',
        remaining: 25 * 60,
        running: false,
        timer: null
      }
    };

    function zeroPad(num) { return num.toString().padStart(2, '0'); }

    function formatClock(now) {
      const hours = now.getHours();
      const minutes = now.getMinutes();
      return `${zeroPad(hours)}:${zeroPad(minutes)}`;
    }

    function formatDateLine(now) {
      const weekday = now.toLocaleDateString(undefined, { weekday: 'short' });
      document.getElementById('weekday').textContent = weekday;
      const fullDate = now.toLocaleDateString(undefined, { year: 'numeric', month: '2-digit', day: '2-digit' });
      document.getElementById('date').textContent = fullDate;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = formatClock(now);
      formatDateLine(now);
    }

    function setBackground(name) {
      const bgEl = document.getElementById('bg');
      bgEl.style.backgroundImage = `url(/static/${encodeURIComponent(name)})`;
    }

    function scheduleNextBackground() {
      clearTimeout(state.slideshowTimer);
      if (!state.backgrounds.length) return;
      const interval = (state.settings.slideshowInterval || 30) * 1000;
      state.slideshowTimer = setTimeout(() => {
        nextBackground();
        scheduleNextBackground();
      }, interval);
    }

    function nextBackground() {
      if (!state.backgrounds.length) return;
      state.currentBg = (state.currentBg + 1) % state.backgrounds.length;
      setBackground(state.backgrounds[state.currentBg]);
    }

    function prevBackground() {
      if (!state.backgrounds.length) return;
      state.currentBg = (state.currentBg - 1 + state.backgrounds.length) % state.backgrounds.length;
      setBackground(state.backgrounds[state.currentBg]);
    }

    function loadBackgrounds() {
      fetch('/backgrounds')
        .then(r => r.json())
        .then(images => {
          state.backgrounds = images || [];
          if (state.backgrounds.length) {
            setBackground(state.backgrounds[state.currentBg]);
            scheduleNextBackground();
          }
        });
    }

    function loadSettings() {
      fetch('/settings')
        .then(r => r.ok ? r.json() : null)
        .then(conf => {
          if (!conf) return;
          state.settings = {
            ...state.settings,
            ...conf,
            pomodoro: { ...state.settings.pomodoro, ...(conf.pomodoro || {}) }
          };
          applySettingsToUI();
        });
    }

    function saveSettings() {
      fetch('/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.settings)
      });
    }

    function applySettingsToUI() {
      document.getElementById('bgInterval').value = state.settings.slideshowInterval || 30;
      document.getElementById('soundcloudUrl').value = state.settings.soundcloudUrl || '';
      document.getElementById('focusMinutes').value = state.settings.pomodoro.focus;
      document.getElementById('breakMinutes').value = state.settings.pomodoro.break;
      document.getElementById('diaryText').value = state.settings.diary || '';
      state.pomodoro.remaining = state.settings.pomodoro.focus * 60;
      updatePomodoroDisplay();
      if (state.settings.soundcloudUrl) {
        setSoundcloudSource(state.settings.soundcloudUrl);
      }
    }

    function toggleMenu() {
      document.getElementById('menuPanel').classList.toggle('open');
    }

    function closeWindow(id) {
      document.getElementById(id).classList.remove('open');
    }

    function openWindow(id) {
      document.getElementById(id).classList.add('open');
      document.getElementById('menuPanel').classList.remove('open');
    }

    function setSoundcloudSource(url) {
      const player = document.getElementById('soundcloudPlayer');
      if (!url) {
        player.classList.remove('active');
        player.removeAttribute('src');
        return;
      }
      const embed = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23c2d5ff&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false`;
      player.src = embed;
      player.classList.add('active');
    }

    function handleSoundcloudStart() {
      if (!state.settings.soundcloudUrl) {
        document.getElementById('settingsWindow').classList.add('open');
        document.getElementById('soundcloudUrl').focus();
        return;
      }
      setSoundcloudSource(state.settings.soundcloudUrl);
    }

    function updatePomodoroDisplay() {
      const minutes = Math.floor(state.pomodoro.remaining / 60);
      const seconds = state.pomodoro.remaining % 60;
      document.getElementById('pomodoroCore').textContent = `${zeroPad(minutes)}:${zeroPad(seconds)}`;
      document.getElementById('pomodoroTitle').textContent = state.pomodoro.mode === 'focus' ? 'Focus' : 'Break';
      const total = state.pomodoro.mode === 'focus' ? state.settings.pomodoro.focus * 60 : state.settings.pomodoro.break * 60;
      const progress = 360 * (1 - state.pomodoro.remaining / total);
      document.getElementById('pomodoroRing').style.setProperty('--progress', progress);
      document.getElementById('pomodoroToggle').textContent = state.pomodoro.running ? 'Pause' : 'Start';
    }

    function tickPomodoro() {
      if (!state.pomodoro.running) return;
      if (state.pomodoro.remaining <= 0) {
        switchPomodoroPhase();
        return;
      }
      state.pomodoro.remaining -= 1;
      updatePomodoroDisplay();
    }

    function startPomodoro() {
      if (state.pomodoro.running) return;
      state.pomodoro.running = true;
      updatePomodoroDisplay();
      state.pomodoro.timer = setInterval(tickPomodoro, 1000);
    }

    function pausePomodoro() {
      state.pomodoro.running = false;
      clearInterval(state.pomodoro.timer);
      updatePomodoroDisplay();
    }

    function switchPomodoroPhase(nextMode) {
      state.pomodoro.mode = nextMode || (state.pomodoro.mode === 'focus' ? 'break' : 'focus');
      state.pomodoro.remaining = (state.pomodoro.mode === 'focus' ? state.settings.pomodoro.focus : state.settings.pomodoro.break) * 60;
      updatePomodoroDisplay();
    }

    function togglePomodoro() {
      if (state.pomodoro.running) {
        pausePomodoro();
      } else {
        startPomodoro();
      }
    }

    function resetPomodoro() {
      pausePomodoro();
      state.pomodoro.mode = 'focus';
      state.pomodoro.remaining = state.settings.pomodoro.focus * 60;
      updatePomodoroDisplay();
    }

    function skipPomodoro() {
      switchPomodoroPhase();
      pausePomodoro();
    }

    function bindControls() {
      document.getElementById('bgNext').addEventListener('click', () => { nextBackground(); scheduleNextBackground(); });
      document.getElementById('bgPrev').addEventListener('click', () => { prevBackground(); scheduleNextBackground(); });
      document.getElementById('menuFab').addEventListener('click', toggleMenu);
      document.getElementById('openDiary').addEventListener('click', () => openWindow('diaryWindow'));
      document.getElementById('openSettings').addEventListener('click', () => openWindow('settingsWindow'));
      document.querySelectorAll('.close-btn').forEach(btn => btn.addEventListener('click', (e) => closeWindow(e.target.dataset.close)));
      document.getElementById('soundcloudStart').addEventListener('click', handleSoundcloudStart);
      document.getElementById('pomodoroToggle').addEventListener('click', togglePomodoro);
      document.getElementById('pomodoroReset').addEventListener('click', resetPomodoro);
      document.getElementById('pomodoroSkip').addEventListener('click', skipPomodoro);
      document.getElementById('bgInterval').addEventListener('change', (e) => {
        state.settings.slideshowInterval = Number(e.target.value) || 30;
        saveSettings();
        scheduleNextBackground();
      });
      document.getElementById('focusMinutes').addEventListener('change', (e) => {
        state.settings.pomodoro.focus = Math.max(5, Number(e.target.value));
        saveSettings();
        resetPomodoro();
      });
      document.getElementById('breakMinutes').addEventListener('change', (e) => {
        state.settings.pomodoro.break = Math.max(1, Number(e.target.value));
        saveSettings();
        if (state.pomodoro.mode === 'break') resetPomodoro();
      });
      document.getElementById('applySoundcloud').addEventListener('click', () => {
        state.settings.soundcloudUrl = document.getElementById('soundcloudUrl').value.trim();
        saveSettings();
        setSoundcloudSource(state.settings.soundcloudUrl);
      });
      document.getElementById('saveDiary').addEventListener('click', () => {
        state.settings.diary = document.getElementById('diaryText').value;
        saveSettings();
        const label = document.getElementById('diarySaved');
        label.textContent = 'Saved just now';
        setTimeout(() => label.textContent = 'Not saved', 2500);
      });

      document.getElementById('openFolderBtn').addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.openFolder) {
          window.electronAPI.openFolder();
        } else {
          alert('Opening the folder requires the Electron build.');
        }
      });

      document.getElementById('overlayBtn').addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.startOverlay) {
          window.electronAPI.startOverlay();
        } else {
          alert('Desktop overlay is available in the Electron build.');
        }
      });

      document.getElementById('wallpaperBtn').addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.startWallpaper) {
          window.electronAPI.startWallpaper();
          document.getElementById('stopDesktopBtn').style.display = 'inline-flex';
        } else {
          alert('Wallpaper mode is available in the Electron build.');
        }
      });

      document.getElementById('stopDesktopBtn').addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.stopDesktopMode) {
          window.electronAPI.stopDesktopMode();
          document.getElementById('stopDesktopBtn').style.display = 'none';
        }
      });
    }

    function init() {
      updateClock();
      setInterval(updateClock, 1000);
      bindControls();
      loadBackgrounds();
      loadSettings();
      applySettingsToUI();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
